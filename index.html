<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-ZITH Learning Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-top: 0; }
        .sidebar button { background: none; border: none; color: white; padding: 15px; text-align: left; cursor: pointer; font-size: 16px; border-radius: 5px; margin-bottom: 5px; }
        .sidebar button:hover, .sidebar button.active { background: #34495e; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button.primary { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button.primary:hover { background: #2980b9; }
        .hidden { display: none; }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 5px; background: #fafafa; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user-msg { background: #d1ecf1; text-align: right; }
        .ai-msg { background: #e2e3e5; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="max-width: 400px; margin: 100px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center;">🎓 X-ZITH Login</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-pass" placeholder="Password">
    <button class="primary" style="width: 100%;" onclick="login()">Login</button>
    <p style="text-align: center; margin-top: 10px;">No account? <a href="#" onclick="toggleRegister()">Sign Up</a></p>
</div>

<!-- MAIN APP -->
<div id="app-screen" class="container hidden">
    <div class="sidebar">
        <h2>👤 <span id="user-display">User</span></h2>
        <button onclick="showPage('dashboard')" class="active">🏠 Dashboard</button>
        <button onclick="showPage('textbook')"> Textbook</button>
        <button onclick="showPage('chat')">🤖 AI Fixto</button>
        <button onclick="showPage('past-questions')">📝 Past Questions</button>
        <button onclick="showPage('search')"> Web Search</button>
        <button onclick="logout()" style="margin-top: auto; background: #c0392b;"> Logout</button>
    </div>
    
    <div class="main-content">
        <!-- Dashboard -->
        <div id="page-dashboard" class="page">
            <h1>Welcome back!</h1>
            <div class="card"><h3>🏆 Total Score: <span id="score-display">0</span></h3></div>
        </div>

        <!-- Textbook -->
        <div id="page-textbook" class="page hidden">
            <h1>📖 Textbook Generator</h1>
            <div class="card">
                <select id="tb-level"><option>JSS</option><option>SSS</option></select>
                <input type="text" id="tb-subject" placeholder="Subject (e.g., Mathematics)">
                <input type="text" id="tb-topic" placeholder="Topic (e.g., Algebra)">
                <button class="primary" onclick="generateTextbook()">Generate Note</button>
            </div>
            <div id="tb-result" class="card hidden"></div>
        </div>

        <!-- Chat -->
        <div id="page-chat" class="page hidden">
            <h1>🤖 AI Fixto</h1>
            <div class="chat-box" id="chat-box"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-input" placeholder="Ask anything...">
                <button class="primary" onclick="sendChat()">Send</button>
            </div>
        </div>

        <!-- Past Questions -->
        <div id="page-past-questions" class="page hidden">
            <h1> Past Questions</h1>
            <div class="card">
                <select id="pq-exam"><option>WAEC</option><option>NECO</option><option>JAMB</option></select>
                <select id="pq-year"><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select>
                <input type="text" id="pq-subject" placeholder="Subject">
                <button class="primary" onclick="getPastQuestions()">Generate Questions</button>
            </div>
            <div id="pq-result" class="card hidden"></div>
        </div>

        <!-- Search -->
        <div id="page-search" class="page hidden">
            <h1>🌐 Web Search</h1>
            <div class="card">
                <input type="text" id="search-query" placeholder="What do you want to search?">
                <button class="primary" onclick="webSearch()">Search</button>
            </div>
            <div id="search-result" class="card hidden"></div>
        </div>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL RENDER URL
    const API_URL = "https://x-zith-backend.onrender.com/api"; 
    let currentUser = null;

    async function apiCall(endpoint, data) {
        const res = await fetch(API_URL + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await res.json();
    }

    function toggleRegister() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const username = prompt("Enter a username:");
        if(username) {
            apiCall('/api/register', { email, password: pass, username }).then(res => {
                if(res.status === 'success') { alert("Registered! Please login."); }
                else { alert(res.detail); }
            });
        }
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const res = await apiCall('/api/login', { email, password: pass });
        if (res.status === 'success') {
            currentUser = res.user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser.username;
        } else {
            alert("Invalid login");
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('page-' + pageId).classList.remove('hidden');
    }

    async function generateTextbook() {
        const res = await apiCall('/api/textbook', {
            email: currentUser.email,
            level: document.getElementById('tb-level').value,
            subject: document.getElementById('tb-subject').value,
            topic: document.getElementById('tb-topic').value
        });
        const div = document.getElementById('tb-result');
        div.classList.remove('hidden');
        div.innerHTML = `<h3>Note:</h3><p>${res.note.replace(/\n/g, '<br>')}</p><h3>Quiz:</h3><pre>${JSON.stringify(res.quiz, null, 2)}</pre>`;
    }

    async function sendChat() {
        const input = document.getElementById('chat-input');
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="message user-msg">${input.value}</div>`;
        const res = await apiCall('/api/chat', { email: currentUser.email, prompt: input.value });
        box.innerHTML += `<div class="message ai-msg">${res.response}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;
    }

    async function getPastQuestions() {
        const res = await apiCall('/api/past-questions', {
            email: currentUser.email,
            exam: document.getElementById('pq-exam').value,
            year: document.getElementById('pq-year').value,
            subject: document.getElementById('pq-subject').value,
            q_type: "Objective",
            level: 1
        });
        const div = document.getElementById('pq-result');
        div.classList.remove('hidden');
        div.innerHTML = `<pre>${JSON.stringify(res.questions, null, 2)}</pre>`;
    }

    async function webSearch() {
        const res = await apiCall('/api/search', { query: document.getElementById('search-query').value });
        const div = document.getElementById('search-result');
        div.classList.remove('hidden');
        div.innerHTML = res.results.replace(/\n/g, '<br>');
    }
</script>
</body>
</html>
