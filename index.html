<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-ZITH Learning Hub</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        .container { display: flex; height: 100vh; }
        #login-screen { max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button.primary { width: 100%; background: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button.secondary { background: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        button.debug { background: #f39c12; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar button { background: none; border: none; color: white; padding: 15px; text-align: left; cursor: pointer; font-size: 16px; border-radius: 5px; margin-bottom: 5px; width: 100%; }
        .sidebar button:hover, .sidebar button.active { background: #34495e; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .hidden { display: none !important; }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 15px; border-radius: 8px; background: #fafafa; margin-bottom: 10px; }
        .message { margin: 10px 0; padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #d1ecf1; margin-left: auto; text-align: right; }
        .ai-msg { background: #e2e3e5; margin-right: auto; }
        @media (max-width: 768px) { .container { flex-direction: column; } .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; } }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>🎓 X-ZITH Learning Hub</h2>
    <div id="auth-forms">
        <div id="login-form">
            <input type="email" id="login-email" placeholder="Email Address">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="primary" onclick="handleLogin()">Login</button>
            <!-- DEBUG BUTTON -->
            <button class="debug" onclick="testConnection()">🔍 TEST SERVER CONNECTION</button>
            <p id="debug-msg" style="font-size:12px; color:blue; margin-top:5px;"></p>
            <p style="margin-top:15px;">No account? <a href="#" onclick="toggleAuth('signup')">Sign Up</a></p>
        </div>
        <div id="signup-form" class="hidden">
            <input type="text" id="signup-user" placeholder="Username">
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-pass" placeholder="Password">
            <button class="primary" onclick="handleSignup()">Create Account</button>
            <p style="margin-top:15px;">Have an account? <a href="#" onclick="toggleAuth('login')">Login</a></p>
        </div>
    </div>
    <p id="error-msg" style="color:red; margin-top:10px;"></p>
</div>

<div id="app-screen" class="container hidden">
    <div class="sidebar">
        <h3>👤 <span id="user-display">User</span></h3>
        <button onclick="showPage('dashboard')" class="active">🏠 Dashboard</button>
        <button onclick="showPage('textbook')">📖 Textbook</button>
        <button onclick="showPage('chat')">🤖 AI Fixto</button>
        <button onclick="showPage('past-questions')">📝 Past Questions</button>
        <button onclick="showPage('search')">🌐 Web Search</button>
        <button onclick="logout()" style="margin-top: auto; background: #c0392b;">🚪 Logout</button>
    </div>
    <div class="main-content">
        <div id="page-dashboard" class="page"><h1>Welcome back!</h1><div class="card"><h3>Score: <span id="score-display">0</span></h3></div></div>
        <div id="page-textbook" class="page hidden">
            <h1>📖 Textbook Generator</h1>
            <div class="card">
                <select id="tb-level"><option value="JSS">JSS</option><option value="SSS">SSS</option></select>
                <input type="text" id="tb-subject" placeholder="Subject">
                <input type="text" id="tb-topic" placeholder="Topic">
                <button class="primary" onclick="generateTextbook()">Generate Note</button>
            </div>
            <div id="tb-result" class="card hidden"></div>
        </div>
        <div id="page-chat" class="page hidden">
            <h1>🤖 AI Fixto</h1>
            <div class="chat-box" id="chat-box"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-input" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') sendChat()">
                <button class="secondary" onclick="sendChat()">Send</button>
            </div>
        </div>
        <div id="page-past-questions" class="page hidden">
            <h1>📝 Past Questions</h1>
            <div class="card">
                <select id="pq-exam"><option>WAEC</option><option>NECO</option><option>JAMB</option></select>
                <select id="pq-year"><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select>
                <input type="text" id="pq-subject" placeholder="Subject">
                <button class="primary" onclick="getPastQuestions()">Generate</button>
            </div>
            <div id="pq-result" class="card hidden"></div>
        </div>
        <div id="page-search" class="page hidden">
            <h1>🌐 Web Search</h1>
            <div class="card">
                <input type="text" id="search-query" placeholder="Search...">
                <button class="primary" onclick="webSearch()">Search</button>
            </div>
            <div id="search-result" class="card hidden"></div>
        </div>
    </div>
</div>

<script>
    // ✅ FIXED: Removed /api from the end
    const API_URL = "https://zith-backend.onrender.com";
    
    let currentUser = null;

    function toggleAuth(mode) {
        document.getElementById('error-msg').innerText = "";
        document.getElementById('debug-msg').innerText = "";
        if (mode === 'signup') {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
        } else {
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }
    }

    async function apiCall(endpoint, data) {
        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await res.json();
        } catch (err) {
            console.error("Network Error:", err);
            return { detail: "Cannot connect to server. Check API URL." };
        }
    }

    // DEBUG FUNCTION
    async function testConnection() {
        const debugEl = document.getElementById('debug-msg');
        debugEl.innerText = "Testing connection...";
        try {
            const res = await fetch(API_URL + '/');
            const data = await res.json();
            debugEl.innerText = "✅ SUCCESS: Backend is running!";
            debugEl.style.color = "green";
        } catch (err) {
            debugEl.innerText = "❌ FAILED: " + err.message;
            debugEl.style.color = "red";
        }
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const errorEl = document.getElementById('error-msg');
        if (!email || !pass) { errorEl.innerText = "Fill all fields."; return; }
        
        errorEl.innerText = "Logging in...";
        const res = await apiCall('/api/login', { email, password: pass });
        
        if (res.status === 'success') {
            currentUser = res.user;
            enterApp();
        } else {
            errorEl.innerText = res.detail || "Login failed.";
        }
    }

    async function handleSignup() {
        const user = document.getElementById('signup-user').value;
        const email = document.getElementById('signup-email').value;
        const pass = document.getElementById('signup-pass').value;
        const errorEl = document.getElementById('error-msg');
        if (!user || !email || !pass) { errorEl.innerText = "Fill all fields."; return; }

        errorEl.innerText = "Creating account...";
        const res = await apiCall('/api/register', { username: user, email, password: pass });
        
        if (res.status === 'success') {
            alert("Account created! Please login.");
            toggleAuth('login');
            errorEl.innerText = "";
        } else {
            errorEl.innerText = res.detail || "Signup failed.";
        }
    }

    function enterApp() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentUser.username;
        document.getElementById('score-display').innerText = currentUser.total_score || 0;
    }

    function logout() {
        currentUser = null;
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('login-email').value = "";
        document.getElementById('login-pass').value = "";
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('page-' + pageId).classList.remove('hidden');
        document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    async function generateTextbook() {
        const btn = event.target;
        btn.innerText = "Generating...";
        const res = await apiCall('/api/textbook', {
            level: document.getElementById('tb-level').value,
            subject: document.getElementById('tb-subject').value,
            topic: document.getElementById('tb-topic').value
        });
        btn.innerText = "Generate Note";
        const div = document.getElementById('tb-result');
        div.classList.remove('hidden');
        div.innerHTML = res.note ? `<h3>Note:</h3><p>${res.note.replace(/\n/g, '<br>')}</p>` : `<p style="color:red">Error.</p>`;
    }

    async function sendChat() {
        const input = document.getElementById('chat-input');
        const box = document.getElementById('chat-box');
        const msg = input.value;
        if(!msg) return;
        box.innerHTML += `<div class="message user-msg">${msg}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;
        const res = await apiCall('/api/chat', { prompt: msg });
        box.innerHTML += `<div class="message ai-msg">${res.response || "Error"}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    async function getPastQuestions() {
        const btn = event.target;
        btn.innerText = "Generating...";
        const res = await apiCall('/api/past-questions', {
            exam: document.getElementById('pq-exam').value,
            year: document.getElementById('pq-year').value,
            subject: document.getElementById('pq-subject').value,
            q_type: "Objective"
        });
        btn.innerText = "Generate";
        const div = document.getElementById('pq-result');
        div.classList.remove('hidden');
        div.innerHTML = res.questions ? `<pre style="white-space: pre-wrap;">${JSON.stringify(res.questions, null, 2)}</pre>` : `<p style="color:red">Error.</p>`;
    }

    async function webSearch() {
        const btn = event.target;
        btn.innerText = "Searching...";
        const res = await apiCall('/api/search', { query: document.getElementById('search-query').value });
        btn.innerText = "Search";
        const div = document.getElementById('search-result');
        div.classList.remove('hidden');
        div.innerHTML = res.results ? res.results.replace(/\n/g, '<br>') : "No results.";
    }
</script>
</body>
</html>
